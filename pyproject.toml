[project]
name = "macross"
version = "0.1.0"
description = "moving average crossover backtest with costs, walk-forward selection and data-snooping tests"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "yfinance"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["macross"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
